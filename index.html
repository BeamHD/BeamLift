<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Beam Lift — personal workout logger">
  <title>Beam Lift</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"><div class="muted">Loading…</div></main>
  <div id="dock"></div>
  <nav id="nav">
    <a href="#today" data-tab="today"><span>●</span>Today</a>
    <a href="#history" data-tab="history"><span>☰</span>History</a>
    <a href="#progress" data-tab="progress"><span>↗</span>Progress</a>
    <a href="#settings" data-tab="settings"><span>⚙</span>Settings</a>
  </nav>
  <div id="sheet-wrap" hidden><div class="backdrop"></div><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="file" accept=".json,.csv,application/json,text/csv,text/plain" hidden>
</body>
</html>
